{% extends 'base.html' %}{% block content %}<section><small>ADMIN PANEL</small><h1>CapitalEdge Control Center</h1><div class="grid"><div class="card"><h3>Users</h3><h2>{{users|length}}</h2></div><div class="card"><h3>Products</h3><h2>{{products|length}}</h2></div><div class="card"><h3>Purchases</h3><h2>{{purchases|length}}</h2></div></div><div class="card"><h2>Add product</h2><form method="post" action="/admin/product"><input name="name" placeholder="Product name" required><input name="description" placeholder="Description"><input name="price" type="number" step=".01" placeholder="Price" required><input name="filename" placeholder="download.zip" required><button class="button">Add</button></form></div><div class="card"><h2>Recent purchases</h2>{% for p in purchases %}<div class="row">{{p.email}} — {{p.name}} <small>{{p.status}}</small></div>{% endfor %}</div></section>{% endblock %}
